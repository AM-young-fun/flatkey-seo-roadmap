name: Server SEO daily collection
on:
  schedule:
    - cron: '30 2,8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-production-daily
  cancel-in-progress: false
jobs:
  collect:
    if: vars.SEO_SERVER_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect, backfill and verify production
        env:
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
          SEO_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/server-seo-daily.cjs
