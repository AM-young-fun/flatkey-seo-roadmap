name: Server SEO daily collection
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      business_only:
        description: Only query and archive GA4 business events/funnels; skip inventory and traffic backfill
        type: boolean
        default: false
      lookback_days:
        description: Ended days per property (14 incremental; 90 historical gap backfill)
        type: choice
        options: ['14', '90']
        default: '14'
      send_notifications:
        description: Allow DingTalk messages (disable for collection-only validation, including test messages)
        type: boolean
        default: true
      verify_dingtalk:
        description: Send one DingTalk test message without collecting data
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: seo-production-daily
  cancel-in-progress: false
jobs:
  collect:
    if: vars.SEO_SERVER_COLLECTION_ENABLED == 'true' && github.ref == 'refs/heads/main' && !inputs.verify_dingtalk
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      inventory: ${{ steps.inventory.outcome }}
      analytics: ${{ steps.analytics.outcome }}
      added: ${{ steps.inventory.outputs.added }}
      imported: ${{ steps.analytics.outputs.imported }}
      unavailable: ${{ steps.analytics.outputs.unavailable }}
      periods: ${{ steps.periods.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sync and verify page inventory
        id: inventory
        if: ${{ !inputs.business_only }}
        continue-on-error: true
        env:
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
        run: node scripts/server-seo-inventory.cjs
      - name: Collect, backfill and verify production
        id: analytics
        if: ${{ !inputs.business_only }}
        continue-on-error: true
        env:
          SEO_COLLECTION_RESULT: /tmp/seo-collection-result.json
          SEO_COLLECTION_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '14' }}
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
          SEO_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/server-seo-daily.cjs
      - name: Collect independent period users and registrations
        id: periods
        if: always() && !inputs.business_only && vars.SEO_WORKFLOW_ENABLED == 'true'
        continue-on-error: true
        env:
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
          SEO_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/server-seo-periods.cjs
      - name: Collect GA4 business events and distinct interval users
        id: business
        if: always() && (vars.SEO_GA4_BUSINESS_COLLECTION_ENABLED == 'true' || inputs.business_only)
        continue-on-error: true
        env:
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
          SEO_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/server-seo-business.cjs --import
      - name: Enforce collection health
        if: always()
        env:
          BUSINESS_ONLY: ${{ inputs.business_only }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          ANALYTICS_OUTCOME: ${{ steps.analytics.outcome }}
          PERIODS_OUTCOME: ${{ steps.periods.outcome }}
          BUSINESS_OUTCOME: ${{ steps.business.outcome }}
        run: |
          if [ "$BUSINESS_ONLY" = true ]; then
            test "$BUSINESS_OUTCOME" = success
          else
            test "$INVENTORY_OUTCOME" = success && test "$ANALYTICS_OUTCOME" = success
            test "$PERIODS_OUTCOME" != failure
            test "$BUSINESS_OUTCOME" != failure
          fi
  notify:
    needs: collect
    if: always() && needs.collect.result != 'skipped' && !inputs.business_only && vars.SEO_UNIFIED_REPORTING_ENABLED != 'true' && (github.event_name != 'workflow_dispatch' || inputs.send_notifications == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Report the daily result in DingTalk
        env:
          SEO_DINGTALK_CONFIG: ${{ secrets.SEO_DINGTALK_CONFIG }}
          COLLECTION_OUTCOME: ${{ needs.collect.result }}
          INVENTORY_OUTCOME: ${{ needs.collect.outputs.inventory }}
          ANALYTICS_OUTCOME: ${{ needs.collect.outputs.analytics }}
          COLLECTION_IMPORTED: ${{ needs.collect.outputs.imported }}
          COLLECTION_UNAVAILABLE: ${{ needs.collect.outputs.unavailable }}
          INVENTORY_ADDED: ${{ needs.collect.outputs.added }}
        run: node scripts/server-seo-alert.cjs
  verify-dingtalk:
    if: github.ref == 'refs/heads/main' && inputs.verify_dingtalk == true && inputs.send_notifications == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send a DingTalk test message
        env:
          SEO_DINGTALK_CONFIG: ${{ secrets.SEO_DINGTALK_CONFIG }}
        run: node scripts/server-seo-alert.cjs --verify
