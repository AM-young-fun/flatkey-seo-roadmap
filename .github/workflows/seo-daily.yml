name: Server SEO daily collection
run-name: ${{ inputs.report_only && format('SEO {0} {1} (send={2})', inputs.report_kind, inputs.report_date, inputs.send_report) || 'Server SEO daily collection' }}
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      report_only:
        description: Prepare or send the unified report only; never collect or send legacy notices
        type: boolean
        default: false
      report_kind:
        description: Report kind (weekly covers previous Friday through Thursday)
        type: choice
        options: [daily, weekly]
        default: daily
      report_date:
        description: Beijing report date YYYY-MM-DD; required for report_only
        type: string
        default: ""
      send_report:
        description: Send the approved report via the existing signed Webhook (false means preview only)
        type: boolean
        default: false
      report_id:
        description: Optional existing immutable report ID; required for an audited retry
        type: string
        default: ""
      periods_only:
        description: Only query independent interval users and registrations; never send notifications
        type: boolean
        default: false
      business_only:
        description: Only query and archive GA4 business events/funnels; skip inventory and traffic backfill
        type: boolean
        default: false
      lookback_days:
        description: Ended days per property (14 incremental; 90 historical gap backfill)
        type: choice
        options: ['14', '90']
        default: '14'
      send_notifications:
        description: Allow DingTalk messages (disable for collection-only validation, including test messages)
        type: boolean
        default: true
      verify_dingtalk:
        description: Send one DingTalk test message without collecting data
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/codex/ga4-registration-cohorts-20261111' && 'seo-cohort-contract-probe' || inputs.report_only && format('seo-report-{0}-{1}', inputs.report_kind, inputs.report_date) || 'seo-production-daily' }}
  cancel-in-progress: false
jobs:
  cohort-probe:
    # This exact branch is a diagnostic-only exception, never a collector/import
    # or notification path. Existing inputs keep workflow_dispatch below 10.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/ga4-registration-cohorts-20261111' && inputs.business_only == true && inputs.send_notifications == false && !inputs.report_only && !inputs.periods_only && !inputs.verify_dingtalk && !inputs.send_report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the GA4 cohort query contract without importing
        env:
          SEO_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_COHORT_PROBE_OUTPUT_DIR: ${{ runner.temp }}/ga4-cohort-probe
          GA4_COHORT_PROBE_MODE: page-view-shape
        run: node scripts/ga4-cohort-probe.cjs
      - name: Archive diagnostic aggregate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-cohort-contract-probe
          path: ${{ runner.temp }}/ga4-cohort-probe
          if-no-files-found: error
          retention-days: 14
  collect:
    if: vars.SEO_SERVER_COLLECTION_ENABLED == 'true' && github.ref == 'refs/heads/main' && !inputs.verify_dingtalk && !inputs.report_only
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      inventory: ${{ steps.inventory.outcome }}
      analytics: ${{ steps.analytics.outcome }}
      added: ${{ steps.inventory.outputs.added }}
      imported: ${{ steps.analytics.outputs.imported }}
      unavailable: ${{ steps.analytics.outputs.unavailable }}
      periods: ${{ steps.periods.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sync and verify page inventory
        id: inventory
        if: ${{ !inputs.business_only && !inputs.periods_only }}
        continue-on-error: true
        env:
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
        run: node scripts/server-seo-inventory.cjs
      - name: Collect, backfill and verify production
        id: analytics
        if: ${{ !inputs.business_only && !inputs.periods_only }}
        continue-on-error: true
        env:
          SEO_COLLECTION_RESULT: /tmp/seo-collection-result.json
          SEO_COLLECTION_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '14' }}
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
          SEO_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/server-seo-daily.cjs
      - name: Collect independent period users and registrations
        id: periods
        if: always() && !inputs.business_only && vars.SEO_WORKFLOW_ENABLED == 'true'
        continue-on-error: true
        env:
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
          SEO_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/server-seo-periods.cjs
      - name: Collect GA4 business events and distinct interval users
        id: business
        if: always() && !inputs.periods_only && (vars.SEO_GA4_BUSINESS_COLLECTION_ENABLED == 'true' || inputs.business_only)
        continue-on-error: true
        env:
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
          SEO_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEO_GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Set only after the full production event/identity rollout is verified.
          GA4_COHORT_COVERAGE_START: ${{ vars.GA4_COHORT_COVERAGE_START }}
        run: node scripts/server-seo-business.cjs --import
      - name: Enforce collection health
        if: always()
        env:
          BUSINESS_ONLY: ${{ inputs.business_only }}
          PERIODS_ONLY: ${{ inputs.periods_only }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          ANALYTICS_OUTCOME: ${{ steps.analytics.outcome }}
          PERIODS_OUTCOME: ${{ steps.periods.outcome }}
          BUSINESS_OUTCOME: ${{ steps.business.outcome }}
        run: |
          if [ "$PERIODS_ONLY" = true ]; then
            test "$PERIODS_OUTCOME" = success
          elif [ "$BUSINESS_ONLY" = true ]; then
            test "$BUSINESS_OUTCOME" = success
          else
            test "$INVENTORY_OUTCOME" = success && test "$ANALYTICS_OUTCOME" = success
            test "$PERIODS_OUTCOME" != failure
            test "$BUSINESS_OUTCOME" != failure
          fi
  notify:
    needs: collect
    if: always() && needs.collect.result != 'skipped' && !inputs.report_only && !inputs.business_only && !inputs.periods_only && vars.SEO_UNIFIED_REPORTING_ENABLED != 'true' && (github.event_name != 'workflow_dispatch' || inputs.send_notifications == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Report the daily result in DingTalk
        env:
          SEO_DINGTALK_CONFIG: ${{ secrets.SEO_DINGTALK_CONFIG }}
          COLLECTION_OUTCOME: ${{ needs.collect.result }}
          INVENTORY_OUTCOME: ${{ needs.collect.outputs.inventory }}
          ANALYTICS_OUTCOME: ${{ needs.collect.outputs.analytics }}
          COLLECTION_IMPORTED: ${{ needs.collect.outputs.imported }}
          COLLECTION_UNAVAILABLE: ${{ needs.collect.outputs.unavailable }}
          INVENTORY_ADDED: ${{ needs.collect.outputs.added }}
        run: node scripts/server-seo-alert.cjs
  verify-dingtalk:
    if: github.ref == 'refs/heads/main' && inputs.verify_dingtalk == true && inputs.send_notifications == true && !inputs.report_only && !inputs.periods_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send a DingTalk test message
        env:
          SEO_DINGTALK_CONFIG: ${{ secrets.SEO_DINGTALK_CONFIG }}
        run: node scripts/server-seo-alert.cjs --verify
  report-send:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.report_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare or send the unified report through the original bot
        env:
          SEO_IMPORT_TOKEN: ${{ secrets.SEO_IMPORT_TOKEN }}
          SEO_DINGTALK_CONFIG: ${{ secrets.SEO_DINGTALK_CONFIG }}
          SEO_REPORT_KIND: ${{ inputs.report_kind }}
          SEO_REPORT_DATE: ${{ inputs.report_date }}
          SEO_REPORT_SEND: ${{ inputs.send_report }}
          SEO_REPORT_ID: ${{ inputs.report_id }}
          SEO_DIGEST_OUTPUT_DIR: ${{ runner.temp }}/seo-digest
        run: |
          args=(--kind="$SEO_REPORT_KIND" --date="$SEO_REPORT_DATE")
          if [ -n "$SEO_REPORT_ID" ]; then
            args+=(--report-id="$SEO_REPORT_ID")
          fi
          if [ "$SEO_REPORT_SEND" = true ]; then
            args+=(--send)
          fi
          node scripts/server-seo-digest-send.cjs "${args[@]}"
      - name: Archive preview and non-secret delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-digest-${{ inputs.report_kind }}-${{ inputs.report_date }}
          path: ${{ runner.temp }}/seo-digest
          if-no-files-found: warn
          retention-days: 30
